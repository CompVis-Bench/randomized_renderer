<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Randomized Annotation → SVG</title></head><body><header class="top"><div><span class="kicker">RANDOMIZED RENDERER</span><h1>Annotation → SVG</h1><p>左侧输入或随机生成 annotation.json，右侧直接生成 SVG。</p></div><div class="actions"><input id="seed" class="seed" placeholder="Seed（可选）" inputmode="numeric"><button id="randomize" class="button">随机生成 annotation</button><button id="render" class="button primary">生成 SVG</button></div></header><main class="layout"><section class="panel"><div class="panel-head"><h2>annotation.json</h2><div><button id="format" class="button">格式化</button><button id="download-json" class="button">下载 JSON</button></div></div><textarea id="annotation" spellcheck="false" aria-label="annotation JSON"></textarea><div class="footer"><span>Seed 相同可复现；留空每次随机</span><span id="status">准备就绪</span></div></section><section class="panel"><div class="panel-head"><h2>SVG Preview</h2><button id="download-svg" class="button">下载 SVG</button></div><div id="preview" class="preview"><div class="empty"><b>◇</b>点击“生成 SVG”查看结果</div></div><div class="help">随机项包括布局、调色、重复结构、合成数据和画布尺寸。</div></section></main><script type="module" src="./main.ts"></script></body></html>
